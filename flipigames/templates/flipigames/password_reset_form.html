{% extends 'flipigames/base.html' %}
{% load crispy_forms_tags %}

{% block title %}Recuperar contraseña | FlipiGames{% endblock %}

{% block content %}

    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card mt-4 form-card-custom border-0 shadow-sm">
                <div class="card-body">
                    <h2>Recuperar contraseña</h2>
                    <p>Introduce el correo asociado a tu cuenta</p>

                    <form method="post">
                        {% csrf_token %}
                        {{ form|crispy }}
                        <button type="submit" class="btn btn-primary w-100">
                            Enviar enlace
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
{% endblock %}

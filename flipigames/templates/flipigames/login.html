{% extends 'flipigames/base.html' %}
{% load crispy_forms_tags %}

{% block title %}Login | FlipiGames{% endblock %}

{% block content %}
  <div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card mt-4 form-card-custom border-0 shadow-sm">
            <div class="card-body">
                <h2 class="card-title text-center">Iniciar Sesión</h2>
                <p class="text-center text-muted">Introduce usuario y contraseña para entrar</p>
                <form method="post">
                    {% csrf_token %}
                    {{ form|crispy }}
                    <button type="submit" class="btn btn-primary w-100 mt-3">Entrar</button>
                    <p class="text-center mt-3">
                        <a href="{% url 'flipigames:password_reset' %}">
                            ¿Has olvidado tu contraseña?
                        </a>
                    </p>
                </form>
            </div>
        </div>
    </div>
  </div>
{% endblock %}
